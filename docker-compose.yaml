version: "3.9"

services:
  postgres:
    image: postgres
    environment:
      POSTGRES_DB: orka
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Mokshgna@123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orka"]
      interval: 10s
      timeout: 5s
      retries: 5
  kafka:
    image: apache/kafka:latest
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Add these
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9092'"]
      interval: 10s
      timeout: 5s
      retries: 10

  dm:
    build:
      context: ./DefinitionManager
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "9090:9090"
    environment:
      PG_ADDRESS: jdbc:postgresql://postgres:5432/orka
      KAFKA_ADDRESS: kafka:9092

  rm:
    build:
      context: ./RunManager
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      dm:
        condition: service_started
    ports:
      - "7070:7070"
    environment:
      PG_ADDRESS: jdbc:postgresql://postgres:5432/orka
      KAFKA_ADDRESS: kafka:9092
      DM_ADDRESS: static://dm:9090
      RM_ADDRESS: static://rm:7070

  rest-service:
    build:
      context: ./RestService
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      dm:
        condition: service_started
      rm:
        condition: service_started
    ports:
      - "4536:4536"
    environment:
      PG_ADDRESS: jdbc:postgresql://postgres:5432/orka
      KAFKA_ADDRESS: kafka:9092
      DM_ADDRESS: static://dm:9090
      RM_ADDRESS: static://rm:7070

  automata:
    build:
      context: ./Automata
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      dm:
        condition: service_started
      rm:
        condition: service_started
    environment:
      PG_ADDRESS: jdbc:postgresql://postgres:5432/orka
      KAFKA_ADDRESS: kafka:9092
      DM_ADDRESS: static://dm:9090
      RM_ADDRESS: static://rm:7070

  script-executor:
    build:
      context: ./ScriptExecutor
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      dm:
        condition: service_started
      rm:
        condition: service_started
    environment:
      PG_ADDRESS: jdbc:postgresql://postgres:5432/orka
      KAFKA_ADDRESS: kafka:9092
      DM_ADDRESS: static://dm:9090
      RM_ADDRESS: static://rm:7070

volumes:
  postgres_data: