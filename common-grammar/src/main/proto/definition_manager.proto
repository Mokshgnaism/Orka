syntax = "proto3";

package orka.api;

import "workflow_definition.proto";
import "all_workflow_definitions.proto";

option java_package = "com.Orka.apiContract.generated.services";
service DefinitionManager{
  rpc CreateWorkflowDefinition(CreateWorkflowDefinitionRequest)
        returns (CreateWorkflowDefinitionResponse);
  rpc GetAllWorkflowDefinitions(GetAllWorkflowDefinitionsRequest)
      returns (GetAllWorkflowDefinitionsResponse);
}