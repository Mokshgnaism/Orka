syntax = "proto3";
package orka.api;

import "workflow_run.proto";
import "ProvideInputRequest.proto";
option java_package = "com.Orka.apiContract.generated.services";

service RunManager{
  rpc startWorkflowRun(StartWorkflowRunRequest)
      returns (StartWorkflowRunResponse);
  rpc provideInput(ProvideInputRequest)
      returns (ProvideInputResponse);
}